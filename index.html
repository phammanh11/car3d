<!doctype html>
<html lang="vi" class="dark" style="margin: 0; padding: 0; background-color: #050608; color: #ffffff; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050608" />
    <title>APEX R8 GT-EVO — 3D Supercar Atelier & Interactive Test Drive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #050608;
        color: #ffffff;
        overflow-x: hidden;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        background-color: #050608;
      }
      .apex-initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #050608;
        z-index: 99999;
      }
      .apex-spinner {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 2px solid rgba(239, 68, 68, 0.15);
        border-top-color: #ef4444;
        animation: apex-spin 0.8s linear infinite;
      }
      @keyframes apex-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#050608] text-white antialiased overflow-x-hidden selection:bg-red-600/40 selection:text-white" style="margin: 0; background-color: #050608;">
    <div id="root">
      <div class="apex-initial-loader">
        <div class="apex-spinner"></div>
        <div style="margin-top: 24px; font-size: 13px; font-weight: 800; letter-spacing: 0.25em; text-transform: uppercase; color: #f5f5f5;">
          APEX <span style="color: #ef4444;">ATELIER 3D</span>
        </div>
        <div style="margin-top: 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #737373;">
          Nạp hệ thống đồ họa WebGL &amp; Vật lý Cannon...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
